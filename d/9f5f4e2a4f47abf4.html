<h1>The Riddle Keeper</h1>

<p>A figure sits in the corner with its face turned away. It does not look up. It only speaks:</p>
<p class="carved">I have keys, but I open no locks.<br>I have space, but I have no room.<br>You can enter, but you can never go in.<br>What am I?</p>
