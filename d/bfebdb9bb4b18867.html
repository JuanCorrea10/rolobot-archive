<script>
(function(){
  var btn = document.getElementById('play'), ctx = null, busy = false;
  var N = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392.00 };
  var M = [['E',1],['E',1],['F',1],['G',1],['G',1],['F',1],['E',1],['D',1],['C',1],['C',1],['D',1],['E',1],['E',1.5],['D',.5],['D',2],
           ['E',1],['E',1],['F',1],['G',1],['G',1],['F',1],['E',1],['D',1],['C',1],['C',1],['D',1],['E',1],['D',1.5],['C',.5],['C',2]];
  btn.addEventListener('click', function () {
    if (busy) return;
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { btn.textContent = 'NO SOUND HERE'; return; }
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime + 0.05, beat = 0.42;
    M.forEach(function (n) {
      var o = ctx.createOscillator(), g = ctx.createGain(), d = n[1] * beat;
      o.type = 'square'; o.frequency.value = N[n[0]];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      g.gain.setValueAtTime(0.07, t + d - 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d - 0.01);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d);
      t += d;
    });
    busy = true; btn.textContent = 'PLAYING...';
    setTimeout(function () { busy = false; btn.textContent = '\u25B6 PLAY AGAIN'; }, (t - ctx.currentTime) * 1000);
  });
})();
</script>
