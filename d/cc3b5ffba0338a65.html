<h1>The Shifted Room</h1>

<p>The room is bare. On the far wall, someone carved a sentence with a nail:</p>
<p class="carved">WKH NHB LV ODQWHUQ</p>
<p>Under it, much smaller, almost apologetic:</p>
<p class="carved small">&mdash; Julius, III</p>
