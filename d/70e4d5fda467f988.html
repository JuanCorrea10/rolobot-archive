<h1>The Riddle Keeper</h1>

<p>A figure sits in the corner with its face turned away. It does not look up. It only speaks:</p>
<p class="carved">I am always coming,<br>but I never arrive.<br>Everyone waits for me.<br>Nobody has ever met me.<br>What am I?</p>
