<h1>The Elevator</h1>

<p class="dim">You step into an old elevator. The display flickers.</p>
<div class="display">FLOOR <span id="floorno">1</span></div>
<div class="floors" id="floors"></div>
<p id="floortxt"></p>
<p class="dim">There is a floor the buttons never learned about. The address bar knows it.</p>

<script>
(function(){
  var T = {
    1:  'The lobby. A desk with nobody behind it. The elevator hums to itself.',
    2:  'Offices. Every chair has been turned to face the wall.',
    3:  'A long table set for twelve. The food is still warm.',
    4:  'Storage. Boxes labelled DO NOT OPEN. All of them empty.',
    5:  'A library. Every book has the same title: ARCHIVE.',
    6:  'The lights do not work on this floor. Something is breathing.',
    7:  'A swimming pool, drained. A single shoe at the bottom.',
    8:  'Servers. Thousands of blinking lights. One of them is red.',
    9:  'A room full of clocks. Each one shows a different time.',
    10: 'Mirrors. You count your reflections. There is one too many.',
    11: 'A greenhouse. Everything is dead except one plant. It turns to look at you.',
    12: 'A door marked 13. It is painted on the wall.',
    13: '<b>FLOOR 13.</b> This floor does not exist. The buttons never knew it; the architects denied it. And yet here you are, between twelve and fourteen, in a place with no walls and no way out. There is a word for a place like this. Welcome to <b>LIMBO</b>. Take its name with you. It is your key.',
    14: 'The roof. From up here the whole archive looks like an eye.',
    0:  'The basement. Scrawled on the wall: "Why do programmers prefer dark mode? Because light attracts bugs." Not a key. Just a joke.',
    42: 'The answer to life, the universe and everything. Not, however, to this door.',
    666: 'No.',
    404: 'This floor could not be found.',
    1337: 'Very clever. Still not the floor you want.'
  };
  var p = new URLSearchParams(location.search).get('floor');
  var f = (p === null) ? 1 : (/^-?\d+$/.test(p.trim()) ? parseInt(p, 10) : NaN);
  var txt;
  if (isNaN(f)) txt = 'The elevator does not understand you. Floors are numbers.';
  else if (T[f] !== undefined) txt = T[f];
  else if (f < 0) txt = 'Underground. It is dark, it is wet, and nothing down here is a key. Go up.';
  else txt = 'The elevator shudders and refuses. There is nothing above the roof.';
  document.getElementById('floorno').textContent = isNaN(f) ? '?' : f;
  document.getElementById('floortxt').innerHTML = txt;
  var box = document.getElementById('floors'), h = '';
  for (var i = 1; i <= 14; i++) {
    if (i === 13) continue;
    h += '<a href="?floor=' + i + '"' + (i === f ? ' class="here"' : '') + '>' + i + '</a>';
  }
  box.innerHTML = h;
})();
</script>
